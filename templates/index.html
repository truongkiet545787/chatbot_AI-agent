<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Demo</title>
    <!-- Nhúng font chữ Inter chất lượng cao -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bubble-user: #4f46e5;
            --bubble-bot: rgba(51, 65, 85, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container chính với hiệu ứng Glassmorphism */
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 85vh;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }

        /* Header thanh lịch */
        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.3);
        }

        .avatar-status {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .chat-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .chat-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Khu vực hiển thị tin nhắn */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Custom thanh cuộn */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Các bong bóng tin nhắn */
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            opacity: 0;
            transform: translateY(10px);
            animation: showBubble 0.3s forwards cubic-bezier(0.1, 0.8, 0.25, 1);
        }

        .message.user {
            align-self: flex-end;
            background: var(--bubble-user);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bubble-bot);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Hiệu ứng loading dấu 3 chấm nhấp nháy */
        .message.loading {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 18px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Khu vực nhập liệu */
        .chat-input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.2);
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            outline: none;
            border-radius: 14px;
            padding: 14px 18px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .chat-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .send-btn {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            outline: none;
            border-radius: 14px;
            padding: 0 24px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes showBubble {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar-status"></div>
            <div>
                <h2>AI Assistant</h2>
                <p>Mô hình miễn phí (OpenRouter - Qwen/Llama)</p>
            </div>
        </div>

        <!-- Chat messages view -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                Chào bạn! Mình có thể giúp gì cho bạn hôm nay?
            </div>
        </div>

        <!-- Input area -->
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Nhập câu hỏi ở đây..." autocomplete="off">
            <button class="send-btn" id="sendBtn">Gửi</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        // Khởi tạo lịch sử cuộc hội thoại
        let messages = [
            {"role": "system", "content": "You are a helpful assistant. Please reply in Vietnamese."}
        ];

        // Hàm cuộn xuống dưới cùng
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Tạo bong bóng chat mới trên giao diện
        function appendMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', role);
            messageDiv.innerHTML = content.replace(/\n/g, '<br>');
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        // Tạo bong bóng loading
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.classList.add('message', 'bot', 'loading');
            loadingDiv.id = 'chatLoading';
            loadingDiv.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
            chatMessages.appendChild(loadingDiv);
            scrollToBottom();
        }

        // Xóa bong bóng loading
        function removeLoading() {
            const loadingDiv = document.getElementById('chatLoading');
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        // Gửi tin nhắn đi
        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Xóa nội dung trong ô nhập liệu
            chatInput.value = '';

            // 1. Thêm tin nhắn của User vào giao diện và vào context
            appendMessage('user', text);
            messages.push({"role": "user", "content": text});

            // 2. Hiển thị loading khi gọi API
            showLoading();

            try {
                // 3. Gửi danh sách context lên server Flask
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ messages: messages })
                });

                const data = await response.json();
                removeLoading();

                if (response.ok && data.content) {
                    // 4. Thêm câu trả lời của AI vào giao diện và vào context
                    appendMessage('bot', data.content);
                    messages.push({"role": "assistant", "content": data.content});
                } else {
                    appendMessage('bot', `Lỗi: ${data.error || 'Không thể kết nối đến server AI.'}`);
                }
            } catch (error) {
                removeLoading();
                appendMessage('bot', 'Lỗi kết nối: Vui lòng kiểm tra server Flask đã chạy chưa.');
                console.error(error);
            }
        }

        // Sự kiện click nút Gửi
        sendBtn.addEventListener('click', handleSend);

        // Sự kiện nhấn Enter trong ô nhập liệu
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        });
    </script>
</body>
</html>
